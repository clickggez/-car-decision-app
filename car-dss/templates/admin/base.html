<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}Admin — CarDSS{% endblock %}</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Noto+Sans+Thai:wght@400;500;600&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <style>
    body { font-family: 'Inter', 'Noto Sans Thai', sans-serif; background:#f5f6f8; }
    .admin-nav { background:#1a1d24; color:#fff; padding:14px 28px; display:flex; align-items:center; gap:24px; }
    .admin-nav a { color:rgba(255,255,255,.7); text-decoration:none; font-size:14px; font-weight:500; }
    .admin-nav a:hover, .admin-nav a.active { color:#fff; }
    .admin-nav .brand { font-weight:600; font-size:16px; color:#fff; }
    .admin-wrap { max-width:1200px; margin:32px auto; padding:0 28px; }
    .card-admin { background:#fff; border:1px solid #e5e7eb; border-radius:10px; padding:24px; margin-bottom:20px; }
    .badge-type { font-size:11px; padding:3px 8px; border-radius:4px; }
    .badge-ev { background:#e0f7ea; color:#00a650; }
    .badge-hybrid { background:#fff4e0; color:#d97706; }
    .badge-ice { background:#fee2e2; color:#b91c1c; }
  </style>
</head>
<body>
{% if session.get('is_admin') %}
<nav class="admin-nav">
  <span class="brand"><i class="bi bi-shield-lock-fill me-2"></i>CarDSS Admin</span>
  <a href="{{ url_for('admin_dashboard') }}" class="{% if request.endpoint=='admin_dashboard' %}active{% endif %}">ภาพรวม</a>
  <a href="{{ url_for('admin_users') }}" class="{% if 'admin_users' in request.endpoint %}active{% endif %}">ผู้ใช้</a>
  <a href="{{ url_for('admin_cars') }}" class="{% if 'admin_cars' in request.endpoint %}active{% endif %}">รถยนต์</a>
  <div class="ms-auto d-flex align-items-center gap-3">
    <span style="font-size:13px;opacity:.6;">{{ session.get('admin_username') }}</span>
    <a href="{{ url_for('index') }}"><i class="bi bi-box-arrow-up-right"></i> ดูเว็บ</a>
    <a href="{{ url_for('admin_logout') }}"><i class="bi bi-box-arrow-right"></i> ออกจากระบบ</a>
  </div>
</nav>
{% endif %}

<div class="admin-wrap">
  {% with msgs = get_flashed_messages(with_categories=true) %}
    {% for cat, m in msgs %}
      <div class="alert alert-{{ 'danger' if cat in ['danger','error'] else cat }}">{{ m }}</div>
    {% endfor %}
  {% endwith %}
  {% block content %}{% endblock %}
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
