{% extends 'admin/base.html' %}
{% block title %}Admin Login{% endblock %}
{% block content %}
<div style="max-width:400px;margin:80px auto;">
  <div class="card-admin">
    <h4 class="mb-1"><i class="bi bi-shield-lock-fill me-2"></i>ผู้ดูแลระบบ</h4>
    <p class="text-muted" style="font-size:13px;">เข้าสู่ระบบหลังบ้าน CarDSS</p>
    {% if error %}<div class="alert alert-danger py-2" style="font-size:13px;">{{ error }}</div>{% endif %}
    <form method="post">
      <div class="mb-3">
        <label class="form-label" style="font-size:13px;">ชื่อผู้ใช้</label>
        <input type="text" name="username" class="form-control" required autofocus>
      </div>
      <div class="mb-3">
        <label class="form-label" style="font-size:13px;">รหัสผ่าน</label>
        <input type="password" name="password" class="form-control" required>
      </div>
      <button class="btn btn-dark w-100">เข้าสู่ระบบ</button>
    </form>
    {% if warn %}
      <div class="alert alert-warning mt-3 mb-0" style="font-size:12px;">{{ warn }}</div>
    {% endif %}
  </div>
</div>
{% endblock %}
